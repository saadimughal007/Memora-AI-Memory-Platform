[project]
name = "memora-agent-memory"
version = "0.1.0"
description = "Gemini-powered AI assistant with short-term and long-term memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0", "fastapi>=0.115.0", "uvicorn[standard]>=0.30.0",
  "streamlit>=1.40.0", "python-dotenv>=1.0.1", "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0", "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0", "requests>=2.32.0"
]
[dependency-groups]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "ruff>=0.6.0"]
[tool.ruff]
line-length = 100
[tool.vercel]
entrypoint = "backend.main:app"
